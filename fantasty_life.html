<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>RPG - Criação de Personagem</title>
    <link rel="stylesheet" href="fantasyLF.css">
</head>
<body>
    <div id="criacao-container">
        <h1>Criar Personagem</h1>
        
        <!-- Área de Preview do Personagem -->
        <div id="preview-container">
            <canvas id="characterCanvas" width="96" height="96"></canvas>
        </div>

        <div class="form-group">
            <label>Cor da Pele:</label>
            <input type="color" id="skinColor" value="#f5d0b1">
        </div>

        <div class="form-group">
            <label>Estilo de Cabelo:</label>
            <select id="hairStyle">
                <option value="short">Curto</option>
                <option value="long">Rabo de Cavalo</option>
                <option value="spiky">Espetado</option>
            </select>
        </div>

        <div class="form-group">
            <label>Cor do Cabelo:</label>
            <input type="color" id="hairColor" value="#8b4513">
        </div>

        <div class="form-group">
            <label>Roupa Inicial:</label>
            <select id="outfitStyle">
                <option value="tunic">Túnica de Aldeão</option>
                <option value="rags">Trajos Simples</option>
            </select>
        </div>

        <button id="btn-comecar">Começar Aventura (Idade: Criança)</button>
    </div>

    <!-- Ecrã do Jogo (inicialmente oculto) -->
    <div id="jogo-container" style="display: none;">
        <h2><span id="nome-char">Herói</span> - Idade: <span id="idade-char">6</span> anos</h2>
        <canvas id="gameCanvas" width="400" height="400"></canvas>
        <button id="btn-envelhecer">Passar Anos (Envelhecer)</button>
    </div>

    <script src="fantasyLF.js"></script>
</body>
                  </html>
