<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz de História e Geografia</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="cabecalho-itens">
        <nav class="navbar">
            <div class="logo">Árvores Peculiares</div>
            <ul class="nav-links">
                <li><a href="index.html">Início</a></li>
                <li><a href="sobre.html">Sobre</a></li>
                <li><a href="galeria.html">Árvores</a></li>
                <li><a href="contato.html">Contato</a></li>
                <li><a href="jogo.html">Jogo</a></li>
            </ul>
        </nav>
        <h1 class="titulo_site">Árvores Peculiares</h1>
    </header>

    <main class="quiz-container">
        <div id="quiz-box">
            <!-- Header do Quiz -->
            <div class="quiz-header">
                <span id="category-badge" class="badge">Categoria</span>
                <span id="question-tracker">Pergunta 1/10</span>
            </div>

            <!-- Barra de Progresso -->
            <div class="progress-bar-container">
                <div id="progress-bar"></div>
            </div>

            <!-- Pergunta -->
            <h2 id="question-text">Bregando a pergunta...</h2>

            <!-- Opções de Resposta -->
            <div id="options-container" class="options-grid"></div>

            <!-- Feedback -->
            <div id="feedback-message" class="feedback hidden"></div>

            <!-- Botão Próximo -->
            <button id="next-btn" class="btn-primary hidden">Próxima Pergunta</button>

            <!-- Tela Final de Resultado (Inicialmente escondida) -->
            <div id="result-screen" class="hidden">
                <h2>Quiz Concluído!</h2>
                <div class="score-display">
                    <p>Sua pontuação:</p>
                    <span id="final-score">0 / 10</span>
                </div>
                <p id="result-message"></p>
                <button id="restart-btn" class="btn-primary">Jogar Novamente</button>
            </div>
        </div>
    </main>

    <footer class="escola">
        <p>©2026 | criado por Daniel | Todos os Direitos Reservados.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
