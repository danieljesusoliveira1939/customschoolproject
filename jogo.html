<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MMORPG Online - Realm of Legends</title>
  <link rel="stylesheet" href="jogo.css">
</head>
<body>

  <div id="game-container">
    <!-- Header/Barra Status do Jogador -->
    <header id="ui-header">
      <div class="status-box">
        <span id="player-name">Heroi</span> [Nv. <span id="player-level">1</span>]
      </div>
      <div class="bars-box">
        <div class="bar-container">
          <div id="hp-bar" class="bar hp"></div>
          <span class="bar-text">HP: <span id="hp-text">100/100</span></span>
        </div>
        <div class="bar-container">
          <div id="exp-bar" class="bar exp"></div>
          <span class="bar-text">EXP: <span id="exp-text">0/100</span></span>
        </div>
      </div>
    </header>

    <!-- Canvas principal do jogo -->
    <canvas id="gameCanvas" width="800" height="500"></canvas>

    <!-- Interface Inferior (Chat e Inventário) -->
    <div id="ui-bottom">
      <!-- Sistema de Chat MMO -->
      <div id="chat-container">
        <div id="chat-messages"></div>
        <form id="chat-form">
          <input type="text" id="chat-input" placeholder="Digite uma mensagem ou comando..." autocomplete="off" />
          <button type="submit">Enviar</button>
        </form>
      </div>

      <!-- Painel de Inventário/Stats -->
      <div id="inventory-container">
        <h3>Inventário</h3>
        <ul id="inventory-list">
          <li>Petição de Vida x3</li>
          <li>Espada de Madeira</li>
        </ul>
        <div id="stats-summary">
          <p>Ataque: <span id="stat-atk">10</span></p>
          <p>Ouro: <span id="stat-gold">0</span>G</p>
        </div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
