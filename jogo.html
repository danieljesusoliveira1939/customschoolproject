<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home | Árvores Peculiares</title>
    
    <!-- CSS Externa e Google Fonts -->
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="jogo.css">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">

    <!-- Tailwind CSS para Overlays da UI -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>

    <header class="cabecalho-itens">
        <nav class="navbar">
            <div class="logo">Árvores Peculiares</div>
            <ul class="nav-links">
                <li><a href="index.html">Início</a></li>
                <li><a href="sobre.html">Sobre</a></li>
                <li><a href="galeria.html">Árvores</a></li>
                <li><a href="contato.html">Contato</a></li>
                <li><a href="jogo.html">Jogo</a></li>
            </ul>
        </nav>
        <h1 class="titulo_site">Árvores Peculiares</h1>
    </header>

    <div id="game-container">
        <!-- Canvas para renderização do jogo -->
        <canvas id="gameCanvas"></canvas>

        <!-- HUD (Interface em jogo) -->
        <div id="hud" class="hidden absolute inset-0 pointer-events-none p-4 flex flex-col justify-between">
            <!-- Barra Superior -->
            <div class="flex justify-between items-start w-full">
                <!-- Vida & Munição -->
                <div class="flex flex-col gap-2 pointer-events-auto">
                    <!-- Barra de Vida -->
                    <div class="glass-panel p-2 rounded-xl flex items-center gap-3 w-64">
                        <span class="text-2xl">❤️</span>
                        <div class="w-full bg-gray-800 h-5 rounded-full overflow-hidden border border-gray-600">
                            <div id="hp-bar-fill" class="bg-red-500 h-full w-full transition-all duration-200"></div>
                        </div>
                        <span id="hp-text" class="text-sm font-bold min-w-[45px]">100/100</span>
                    </div>

                    <!-- Indicador de Munição e Recarga -->
                    <div class="glass-panel p-2 rounded-xl flex items-center justify-between w-64">
                        <div class="flex items-center gap-2">
                            <span id="hud-apple-icon" class="text-2xl">🍎</span>
                            <div class="flex flex-col">
                                <span class="text-xs text-gray-300">Sementes</span>
                                <span id="ammo-text" class="text-xl font-bold tracking-wider text-green-400">10 / 10</span>
                            </div>
                        </div>
                        <button id="reload-btn" onclick="triggerReload()" class="pointer-events-auto btn-amber text-xs px-3 py-2 rounded-lg font-bold text-white flex items-center gap-1">
                            <span>COMER</span> <span class="bg-black/30 px-1.5 py-0.5 rounded">[R]</span>
                        </button>
                    </div>
                </div>

                <!-- Barra do Chefão (Visível apenas em rodadas de Chefão) -->
                <div id="boss-hp-container" class="hidden flex-col items-center w-1/3 max-w-md glass-panel p-3 rounded-2xl border-red-500 border-2">
                    <div class="flex justify-between w-full mb-1">
                        <span id="boss-name" class="font-bold text-red-400 text-sm uppercase tracking-wide">CHEFÃO LENHADOR</span>
                        <span id="boss-hp-text" class="font-bold text-sm">1000/1000</span>
                    </div>
                    <div class="w-full bg-gray-900 h-6 rounded-full overflow-hidden border border-red-800">
                        <div id="boss-hp-fill" class="bg-gradient-to-r from-red-600 to-amber-500 h-full w-full transition-all duration-150"></div>
                    </div>
                </div>

                <!-- Pontuação, Rodada e Maçãs -->
                <div class="glass-panel p-3 rounded-xl flex flex-col gap-1 items-end min-w-[160px]">
                    <div class="text-amber-400 font-bold flex items-center gap-1 text-lg">
                        <span>🍎</span> <span id="hud-coins">0</span>
                    </div>
                    <div class="text-xs text-gray-300">Round: <span id="hud-round" class="text-white font-bold text-sm">1</span></div>
                    <div class="text-xs text-gray-300">Pontos: <span id="hud-score" class="text-white font-bold text-sm">0</span></div>
                    <div class="text-[10px] text-gray-400">Inimigos: <span id="hud-enemies" class="text-gray-200 font-bold">0</span></div>
                </div>
            </div>

            <!-- Botão de Som & Alerta de Sem Munição -->
            <div class="flex justify-between items-end pointer-events-auto">
                <button id="sound-btn" onclick="toggleAudio()" class="glass-panel px-3 py-2 rounded-xl text-xl hover:bg-white/10 transition">
                    🔊
                </button>
                <div id="reload-prompt" class="hidden glass-panel px-4 py-2 rounded-xl text-amber-400 font-bold text-sm border border-amber-500/50 reload-pulse">
                    ⚠️ Sem sementes! Aperte 'R' ou clique em COMER!
                </div>
            </div>
        </div>

        <!-- MENU PRINCIPAL OVERLAY -->
        <div id="main-menu" class="absolute inset-0 flex items-center justify-center p-4 bg-black/60">
            <div class="glass-panel p-6 sm:p-8 rounded-3xl max-w-md w-full text-center flex flex-col items-center border-2 border-green-500/40 shadow-2xl">
                <div class="relative mb-
